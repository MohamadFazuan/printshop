name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # sharp ships a native binary per platform and cannot be cross-built,
          # so each installer is produced on a runner of its own architecture.
          # The arch below is set by the CLI flag only — do NOT add an "arch"
          # list to build.mac.target in package.json. It overrides this flag and
          # silently emits a second dmg carrying the wrong architecture's sharp
          # binary: it installs, launches, and dies at the first export.
          - os: macos-latest # Apple Silicon
            target: --mac --arm64
            artifact: printshop-macos-arm64
            glob: release/*.dmg
          - os: macos-15-intel # Intel; macos-13 was retired and never gets a runner
            target: --mac --x64
            artifact: printshop-macos-intel
            glob: release/*.dmg
          - os: windows-latest
            target: --win
            artifact: printshop-windows
            glob: release/*.exe

    runs-on: ${{ matrix.os }}

    # Attaching installers to a release is a write to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap gate — a broken build should not reach an installer.
      - run: npm run verify

      # Unsigned on purpose — see README. Signing needs paid certificates.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Kept for workflow_dispatch runs, which have no tag to release against.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      # An artifact needs a GitHub login and expires; the staff guide sends
      # people to a download page. Each runner appends its own installer to the
      # one release for this tag.
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
          fail_on_unmatched_files: true
          draft: false
          body: |
            Unsigned builds. macOS: right-click → Open the first time.
            Windows: More info → Run anyway.

            Each machine also needs the Codex CLI installed and signed in to a
            ChatGPT plan — see STAFF-GUIDE.md.
